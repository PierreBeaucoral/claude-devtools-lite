<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">Ember layout</title>
  <desc id="d">Sidebar with projects, sessions, search and memory; session timeline above an embedded terminal; token use, plan/config and viz/files panes on the right.</desc>
  <style>
    .bg { fill: #faf7f2 } .win { fill: #f2eee7; stroke: #d9d2c7 } .pane { fill: #ffffff; stroke: #e0d9cf }
    .h { fill: #20242b } .t { fill: #5b5f66 } .line { fill: #e9e4dc } .term { fill: #20242b } .termt { fill: #d6d2cc }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191b20 } .win { fill: #20242b; stroke: #393d44 } .pane { fill: #292d34; stroke: #393d44 }
      .h { fill: #f3efe9 } .t { fill: #a9adb4 } .line { fill: #393d44 } .term { fill: #121418 }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .h { font-size: 17px; font-weight: 700; letter-spacing: 1.5px }
    .t { font-size: 15px }
  </style>
  <rect class="bg" width="1280" height="660" rx="24"/>
  <!-- window chrome -->
  <rect class="win" x="32" y="28" width="1216" height="604" rx="16"/>
  <circle cx="60" cy="54" r="7" fill="#ec6a5e"/><circle cx="84" cy="54" r="7" fill="#f4bf4f"/><circle cx="108" cy="54" r="7" fill="#61c554"/>
  <text x="640" y="60" text-anchor="middle" class="t">Ember</text>

  <!-- sidebar -->
  <rect class="pane" x="48" y="80" width="228" height="536" rx="10"/>
  <rect x="64" y="96" width="28" height="28" rx="7" fill="#dd876d"/>
  <path d="M71 104 l6 6 -6 6 M81 116 h8" stroke="#20242b" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="116" class="h" letter-spacing="0">Ember</text>
  <text x="64" y="160" class="h">PROJECTS</text>
  <rect x="64" y="176" width="196" height="30" rx="6" fill="#dd876d" opacity=".18"/>
  <rect x="64" y="176" width="3" height="30" fill="#dd876d"/>
  <text x="78" y="196" class="t">my-paper</text>
  <text x="78" y="232" class="t">↳ session · 2h ago</text>
  <text x="78" y="262" class="t">↳ session · yesterday</text>
  <text x="78" y="292" class="t">dotfiles</text>
  <text x="64" y="340" class="h">SEARCH</text>
  <rect class="line" x="64" y="354" width="196" height="30" rx="6"/>
  <text x="76" y="374" class="t mono">⌘K  sessions, files…</text>
  <text x="64" y="424" class="h">MEMORY</text>
  <rect class="line" x="64" y="440" width="170" height="10" rx="5"/>
  <rect class="line" x="64" y="460" width="130" height="10" rx="5"/>

  <!-- session timeline -->
  <rect class="pane" x="288" y="80" width="560" height="300" rx="10"/>
  <text x="306" y="110" class="h">SESSION</text>
  <text x="306" y="146" class="t">› prompt</text>
  <rect class="line" x="380" y="136" width="300" height="12" rx="6"/>
  <text x="306" y="178" class="t">◇ thinking</text>
  <rect class="line" x="400" y="168" width="220" height="12" rx="6"/>
  <text x="306" y="210" class="t">⚙ Edit server.py</text>
  <rect x="306" y="222" width="524" height="22" rx="4" fill="#3fb950" opacity=".18"/>
  <rect x="306" y="246" width="524" height="22" rx="4" fill="#f85149" opacity=".16"/>
  <text x="316" y="238" class="t mono">+ added line</text>
  <text x="316" y="262" class="t mono">− removed line</text>
  <g fill="#dd876d">
    <rect x="306" y="340" width="14" height="24"/><rect x="324" y="330" width="14" height="34"/><rect x="342" y="318" width="14" height="46"/>
    <rect x="360" y="304" width="14" height="60"/><rect x="378" y="292" width="14" height="72"/>
    <rect x="396" y="350" width="14" height="14" fill="#f85149"/><rect x="414" y="340" width="14" height="24"/><rect x="432" y="326" width="14" height="38"/>
  </g>
  <text x="460" y="360" class="t">context window · compaction in red</text>

  <!-- terminal -->
  <rect class="term" x="288" y="392" width="560" height="224" rx="10"/>
  <text x="306" y="422" class="h" fill="#dd876d" style="fill:#dd876d">TERMINAL</text>
  <text x="306" y="458" class="termt mono" font-size="15">$ claude --resume 1ce2d4d8</text>
  <text x="306" y="486" class="termt mono" font-size="15" opacity=".7">✻ Welcome back! Resuming session…</text>
  <text x="306" y="514" class="termt mono" font-size="15" opacity=".7">&gt; write the chart to $CLAUDE_DEVTOOLS_VIZ_DIR</text>
  <rect x="306" y="530" width="10" height="18" fill="#dd876d"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <!-- right column -->
  <rect class="pane" x="860" y="80" width="372" height="170" rx="10"/>
  <text x="878" y="110" class="h">TOKEN USE</text>
  <text x="878" y="140" class="t">5-hour block · resets in 2h 14m</text>
  <rect class="line" x="878" y="156" width="336" height="12" rx="6"/>
  <rect x="878" y="156" width="210" height="12" rx="6" fill="#dd876d"/>
  <polyline points="878,228 910,214 942,220 974,196 1006,204 1038,180 1070,190 1102,172 1134,184 1166,166 1214,176" fill="none" stroke="#dd876d" stroke-width="2.5" stroke-linejoin="round"/>

  <rect class="pane" x="860" y="262" width="372" height="170" rx="10"/>
  <text x="878" y="292" class="h">PLAN · CONFIG</text>
  <text x="878" y="326" class="t">☑  clean the panel data</text>
  <text x="878" y="354" class="t">◐  estimate event study</text>
  <text x="878" y="382" class="t">☐  write results section</text>
  <text x="878" y="412" class="t" opacity=".8">ticks write back to .claude/plan.md</text>

  <rect class="pane" x="860" y="444" width="372" height="172" rx="10"/>
  <text x="878" y="474" class="h">VIZ · FILES</text>
  <g fill="none" stroke="#dd876d" stroke-width="2.5">
    <line x1="890" y1="560" x2="1206" y2="560" stroke-dasharray="4 5" opacity=".6"/>
    <polyline points="896,566 940,562 984,568 1028,560 1072,532 1116,516 1160,506 1200,498"/>
  </g>
  <g fill="#dd876d"><circle cx="896" cy="566" r="4"/><circle cx="940" cy="562" r="4"/><circle cx="984" cy="568" r="4"/><circle cx="1028" cy="560" r="4"/><circle cx="1072" cy="532" r="4"/><circle cx="1116" cy="516" r="4"/><circle cx="1160" cy="506" r="4"/><circle cx="1200" cy="498" r="4"/></g>
  <text x="878" y="600" class="t">figures appear within 5 s</text>
</svg>
